<script src="../api.js"></script>
<style>
:root{
  --bg:#F3F3F6; --panel:#FFFFFF; --ink:#18181B; --muted:#62626B; --line:#E2E2E8;
  --acc:#E53935; --acc-ink:#FFFFFF; --acc-soft:#FDECEA; --dark:#18181B; --azul:#2F6FEB;
  --ok:#1E7A46; --ok-bg:#E6F4EC; --warn:#8A6100; --warn-bg:#FFF4D1; --err:#B42318; --err-bg:#FDECEA; --chip:#EEEEF2;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;font-weight:700;margin:0}
[hidden]{display:none!important}
a{color:var(--azul)}
.num{font-variant-numeric:tabular-nums}

/* Ingreso */
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--dark)}
.login .card{width:100%;max-width:420px;background:var(--panel);border-radius:16px;padding:28px}
.login p{color:var(--muted);margin:4px 0 20px}
.logo{display:block;height:auto}
.login .logo{width:230px;color:var(--ink);margin-bottom:16px}
.marca-consola{display:inline-block;background:var(--dark);color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 8px;margin-bottom:10px}

/* Estructura */
.top{background:var(--dark);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .logo{width:150px;color:#fff;flex:none}
.top .ctx{flex:1;min-width:100px;font-size:13px;color:#BDBDC6;border-left:1px solid #3A3A40;padding-left:12px}
.top .ctx b{color:#fff;display:block;font-size:14px}
.top button{background:none;border:0;color:#BDBDC6;cursor:pointer;padding:6px;margin-left:auto}
.tabs{display:flex;gap:4px;padding:0 16px;background:var(--dark);overflow-x:auto}
.tabs button{background:none;border:0;color:#BDBDC6;padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap}
.tabs button.on{color:#fff;border-color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:20px 16px 80px}
@media(max-width:520px){.top .ctx{border:0;padding-left:0;flex-basis:100%;order:3}}

/* Componentes */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel+.panel{margin-top:14px}
.panel h2{font-size:18px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#C6C6CE}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.azul{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.danger{color:var(--err)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);font-weight:400}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
input[type=radio],input[type=checkbox]{width:auto}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.mt{margin-top:14px}
.aviso{border-radius:10px;padding:10px 12px;font-size:14px}
.aviso.ok{background:var(--ok-bg);color:var(--ok)}
.aviso.err{background:var(--err-bg);color:var(--err)}
.aviso.warn{background:var(--warn-bg);color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ACTIVO{background:var(--ok-bg);color:var(--ok)}
.p-SUSPENDIDO{background:var(--warn-bg);color:var(--warn)}
.p-BAJA{background:var(--chip);color:var(--muted)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;color:#45454D}
.chip.err{background:var(--err-bg);color:var(--err)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}

/* Resumen */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-family:Poppins;font-size:24px;margin-top:4px}
.alerta{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.alerta:last-child{border-bottom:0}
.alerta .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;flex:none}
.alerta.PAGO .ic{background:var(--err-bg);color:var(--err)}
.alerta.TESTIMONIO .ic{background:#E8EFFE;color:var(--azul)}
.alerta.TRUEQUE .ic,.alerta.CONSUMO .ic{background:var(--warn-bg);color:var(--warn)}
.alerta b{display:block}
.alerta small{color:var(--muted)}
.dos{display:grid;grid-template-columns:3fr 2fr;gap:14px}
@media(max-width:900px){.dos{grid-template-columns:1fr}}

/* Tablas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.t th,table.t td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#FAFAFB;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#FAFAFB}
table.t tr.anulado td{color:var(--muted);text-decoration:line-through}
.vacio{text-align:center;padding:30px 16px;color:var(--muted)}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:12px}
@media(max-width:760px){.toolbar{grid-template-columns:1fr 1fr}}

/* Ficha */
.ficha-cab{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.ficha-cab h1{font-size:26px}
.ficha-cab .sub{color:var(--muted);font-size:14px;margin-top:2px}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;border-bottom:1px solid var(--line)}
.subtabs button{background:none;border:0;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.subtabs button.on{color:var(--ink);border-color:var(--acc)}
.cifras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:760px){.cifras{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cifra{background:#FAFAFB;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cifra span{font-size:12px;color:var(--muted);font-weight:600}
.cifra b{display:block;font-size:18px;margin-top:2px}

/* Diálogos */
dialog{border:0;border-radius:16px;padding:0;width:min(640px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dh h2{font-size:19px;flex:1}
.db{padding:18px 20px;overflow:auto;max-height:65vh}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.pasos{display:flex;gap:6px;margin-bottom:14px}
.pasos span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.pasos span.on{background:var(--acc)}
.opciones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:560px){.opciones{grid-template-columns:1fr}}
.opcion{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.opcion:has(input:checked){border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opcion b{display:block}
.opcion small{color:var(--muted)}
.credencial{background:#FAFAFB;border:1px dashed #C6C6CE;border-radius:12px;padding:14px;font-size:15px}
.credencial code{font-size:20px;font-weight:700;letter-spacing:.06em;font-family:ui-monospace,Menlo,monospace}
.msj{white-space:pre-wrap;background:#FAFAFB;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 16px;border-radius:12px;max-width:92vw;z-index:100;font-size:14px}
#toast.err{background:var(--err)}
#cargando{position:fixed;inset:0;background:rgba(255,255,255,.55);display:grid;place-items:center;z-index:90}
.spin{width:38px;height:38px;border:4px solid #E2E2E8;border-top-color:var(--acc);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
</style>
</head>

    <span class="marca-consola">Consola</span>
    <div id="f-ingreso">
      <h1 style="font-size:22px">Administración de la plataforma</h1>
      <p>Acceso exclusivo del equipo PrestoPronto.</p>
      <form class="grid" id="frm-ingreso" novalidate>
        <label class="f">Correo<input type="email" id="l-email" autocomplete="username"></label>

<dialog id="dlg"><form method="dialog" id="dlg-form" novalidate>
  <div class="dh"><h2 id="dlg-t"></h2><button class="btn sm" value="cancel" formnovalidate>Cerrar</button></div>
  <div class="db" id="dlg-b"></div>
  <div class="df" id="dlg-f"></div>
</form></dialog>

<script>
'use strict';
/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const CLP=new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0});
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pesos=v=>(v===''||v==null||isNaN(Number(v)))?'':CLP.format(Number(v));
const PLANES={WEB:'Solo web',WEB_PEDIDOS:'Web más pedidos',COMPLETO:'Completo'};
const ROLES={SUPERADMIN:'PrestoPronto',DUENO:'Dueño',ENCARGADO:'Encargado',COCINA:'Cocina',REPARTIDOR:'Repartidor'};
const ESTADOS={ACTIVO:'Activo',SUSPENDIDO:'Suspendido',BAJA:'De baja'};
function fecha(v){ if(!v) return ''; const d=new Date(v); return isNaN(d)?'':d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fechaHora(v){ if(!v) return ''; const d=new Date(v); return isNaN(d)?'':d.toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function iso(v){ if(!v) return ''; const d=new Date(v); if(isNaN(d)) return ''; const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function hoyIso(dias){ const d=new Date(); d.setDate(d.getDate()+(dias||0)); return iso(d); }
function pill(e){ return `<span class="pill p-${esc(e)}"><i></i>${esc(ESTADOS[e]||e)}</span>`; }
function toast(m,err){ const t=$('#toast'); t.textContent=m; t.className=err?'err':''; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,err?6500:3000); }
function cargando(on){ $('#cargando').hidden=!on; }
async function tarea(fn, ok){ cargando(true); try{ const r=await fn(); if(ok) toast(ok); return r; } catch(e){ toast(e.message,true); throw e; } finally{ cargando(false); } }
function urlSitio(){ return new URL('../sitio/', location.href).href; }
function urlWeb(slug){ return new URL('../web/?n='+encodeURIComponent(slug), location.href).href; }
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }

/* Diálogo genérico: devuelve una promesa que se resuelve con el botón presionado */
function dialogo(titulo, cuerpo, botones){
  $('#dlg-t').textContent=titulo; $('#dlg-b').innerHTML=cuerpo;
  $('#dlg-f').innerHTML=(botones||[]).map(b=>`<button type="button" class="btn ${b.clase||''}" data-v="${b.v}">${esc(b.t)}</button>`).join('');
  const d=$('#dlg'); if(!d.open) d.showModal();
  return new Promise(res=>{
    $('#dlg-f').onclick=e=>{ const b=e.target.closest('[data-v]'); if(b) res(b.dataset.v); };
    d.onclose=()=>{ if(d.dataset.ignorar){ delete d.dataset.ignorar; return; } res('cancel'); };
  });
}
/* Cierre hecho por el programa: el evento close llega después y no debe contarse como cancelar */
function cerrarDialogo(){ const d=$('#dlg'); if(d.open){ d.dataset.ignorar='1'; d.close(); } }
function errorEnDialogo(m){ let e=$('#dlg-err'); if(!e){ $('#dlg-b').insertAdjacentHTML('beforeend','<div id="dlg-err" class="aviso err mt"></div>'); e=$('#dlg-err'); } e.textContent=m; }

/* Muestra una credencial recién creada, con un mensaje listo para enviar */
function mostrarAcceso(a){
  const esPin=!!a.pin;
  const msj = esPin
    ? `Hola ${a.nombre}, tu acceso a PrestoPronto (${ROLES[a.rol]}):\nNegocio: ${a.negocio}\nPIN: ${a.pin}\nNo lo compartas con nadie.`
    : `Hola ${a.nombre}, tu acceso a PrestoPronto:\nIngresa en ${a.rol==='SUPERADMIN'?location.href:urlSitio()}\nCorreo: ${a.email}\nClave temporal: ${a.clave}\nTe pedirá crear tu propia clave al entrar.`;
  return dialogo('Acceso de '+a.nombre, `
    <div class="credencial">${esPin?`PIN de ${esc(ROLES[a.rol])}<br><code>${esc(a.pin)}</code>`:`Correo: <b>${esc(a.email)}</b><br>Clave temporal: <code>${esc(a.clave)}</code>`}</div>
    <p class="muted">Esta es la única vez que se muestra. Entrégalo por un canal privado; nadie, ni siquiera PrestoPronto, podrá volver a verlo.</p>
    <label class="f">Mensaje listo para copiar<div class="msj" id="msj-acceso">${esc(msj)}</div></label>`,
    [{t:'Copiar mensaje',v:'copiar'},{t:'Listo',v:'ok',clase:'pri'}]).then(async v=>{
      if(v==='copiar'){ try{ await navigator.clipboard.writeText(msj); toast('Mensaje copiado.'); }catch(e){ toast('No se pudo copiar; selecciona el texto.',true); } return mostrarAcceso(a); }
      cerrarDialogo();
    });
}

/* ================= Ingreso ================= */
let PERFIL=null;
function verIngreso(msg){
  PERFIL=null; $('#v-app').hidden=true; $('#v-login').hidden=false; $('#f-ingreso').hidden=false; $('#f-cambio').hidden=true;
  $('#l-clave').value=''; $('#l-msg').innerHTML=msg?`<div class="aviso err">${esc(msg)}</div>`:'';
}
async function abrir(perfil){
  PERFIL=perfil;
  if(perfil.debe_cambiar_clave){ $('#f-ingreso').hidden=true; $('#f-cambio').hidden=false; $('#v-login').hidden=false; $('#v-app').hidden=true; return; }
  if(perfil.usuario.rol!=='SUPERADMIN'){ await PP_API.salir(); verIngreso('Esta cuenta no tiene acceso a la Consola.'); return; }
  $('#t-usuario').textContent=perfil.usuario.nombre+' · '+perfil.usuario.email;
  $('#v-login').hidden=true; $('#v-app').hidden=false;
  irA('resumen');
}
$('#frm-ingreso').addEventListener('submit',async e=>{
  e.preventDefault(); const em=val('l-email'), cl=$('#l-clave').value;
  if(!em||!cl){ $('#l-msg').innerHTML='<div class="aviso err">Ingresa tu correo y tu clave.</div>'; return; }
  cargando(true); $('#l-msg').innerHTML='';
  try{ await abrir(await PP_API.ingresar(em,cl)); }catch(err){ $('#l-msg').innerHTML=`<div class="aviso err">${esc(err.message)}</div>`; } finally{ cargando(false); }
});
$('#frm-cambio').addEventListener('submit',async e=>{
  e.preventDefault(); const a=$('#c-actual').value,n=$('#c-nueva').value,n2=$('#c-nueva2').value;
  const m=t=>{ $('#c-msg').innerHTML=`<div class="aviso err">${esc(t)}</div>`; };
  if(!a||!n) return m('Completa los tres campos.'); if(n!==n2) return m('Las dos claves nuevas no coinciden.');
  if(n.length<8||!/[A-Za-z]/.test(n)||!/\d/.test(n)) return m('La nueva clave debe tener al menos 8 caracteres, con letras y números.');
  cargando(true); try{ await abrir(await PP_API.cambiarClave(a,n)); toast('Clave actualizada.'); }catch(err){ m(err.message); } finally{ cargando(false); }
});
$('#b-salir').addEventListener('click',async()=>{ cargando(true); await PP_API.salir(); cargando(false); verIngreso(''); });

/* ================= Navegación ================= */
const SECCIONES=['resumen','negocios','ficha','equipo','bitacora'];
function irA(tab){
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===(tab==='ficha'?'negocios':tab)));
  SECCIONES.forEach(s=>$('#tab-'+s).hidden=s!==tab);
  ({resumen:verResumen,negocios:verNegocios,equipo:verEquipo,bitacora:verBitacora})[tab]?.();
}
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b) irA(b.dataset.tab); });

/* ================= Resumen ================= */
async function verResumen(){
  const c=$('#tab-resumen'); c.innerHTML='<div class="vacio">Cargando…</div>';
  let r; try{ r=await PP_API.resumenConsola(); }catch(e){ c.innerHTML=`<div class="aviso err">${esc(e.message)}</div>`; return; }
  const ic={PAGO:'$',TESTIMONIO:'★',TRUEQUE:'⇄',CONSUMO:'⏳'};
  c.innerHTML=`
    <div class="kpis">
      <div class="kpi"><span>Activos</span><b>${r.totales.activos}</b></div>
      <div class="kpi"><span>Suspendidos</span><b>${r.totales.suspendidos}</b></div>
      <div class="kpi"><span>De baja</span><b>${r.totales.baja}</b></div>
      <div class="kpi"><span>Cobrado en dinero</span><b class="num">${pesos(r.recaudado.dinero)}</b></div>
      <div class="kpi"><span>Cobrado en trueque</span><b class="num">${pesos(r.recaudado.trueque)}</b></div>
    </div>
    <div class="dos">
      <div class="panel"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">Requiere atención</h2><span class="spacer"></span>
        ${r.por_plan.map(p=>`<span class="chip">${esc(PLANES[p.plan])}: ${p.cantidad}</span>`).join(' ')}</div>
        ${r.alertas.length?r.alertas.map(a=>`<div class="alerta ${a.tipo}" data-neg="${esc(a.negocio_id)}"><span class="ic">${ic[a.tipo]}</span><div><b>${esc(a.nombre)}</b><small>${esc(a.texto)}</small></div></div>`).join('')
          :'<div class="vacio">Todo al día. No hay pagos atrasados, testimonios pendientes ni trueques por vencer.</div>'}
      </div>
      <div class="panel"><h2>Últimos movimientos</h2>
        ${r.movimientos.length?`<div class="tw"><table class="t"><tbody>${r.movimientos.map(b=>`<tr><td class="muted" style="white-space:nowrap">${fechaHora(b.fecha)}</td><td><b>${esc(b.accion)}</b><br><small class="muted">${esc(b.usuario_nombre)}${b.soporte==='SI'?' (soporte)':''} · ${esc(b.detalle)}</small></td></tr>`).join('')}</tbody></table></div>`:'<div class="vacio">Sin movimientos.</div>'}
      </div>
    </div>`;
  c.querySelectorAll('[data-neg]').forEach(a=>a.onclick=()=>abrirFicha(a.dataset.neg,'cobro'));
}

/* ================= Negocios ================= */
let LISTA=[];
async function verNegocios(){
  const c=$('#tab-negocios');
  c.innerHTML=`<div class="toolbar">
      <label class="f">Buscar<input type="search" id="n-q" placeholder="Nombre, comuna o dirección web"></label>
      <label class="f">Estado<select id="n-est"><option value="">Todos</option><option value="ACTIVO">Activos</option><option value="SUSPENDIDO">Suspendidos</option><option value="BAJA">De baja</option></select></label>
      <label class="f">Plan<select id="n-plan"><option value="">Todos</option>${Object.entries(PLANES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
      <button class="btn pri" type="button" id="b-nuevo-neg">Nuevo negocio</button></div>
    <div id="n-lista"><div class="vacio">Cargando…</div></div>`;
  ['n-q','n-est','n-plan'].forEach(id=>$('#'+id).addEventListener('input',pintarLista));
  $('#b-nuevo-neg').onclick=asistenteNegocio;
  try{ LISTA=await PP_API.listarNegocios(); pintarLista(); }catch(e){ $('#n-lista').innerHTML=`<div class="aviso err">${esc(e.message)}</div>`; }
}
function pintarLista(){
  const q=val('n-q').toLowerCase(), est=val('n-est'), plan=val('n-plan');
  const L=LISTA.filter(n=>(!est||n.estado_servicio===est)&&(!plan||n.plan===plan)&&(!q||[n.nombre,n.comuna,n.slug].join(' ').toLowerCase().includes(q)));
  if(!L.length){ $('#n-lista').innerHTML='<div class="vacio panel">No hay negocios con esos filtros.</div>'; return; }
  $('#n-lista').innerHTML=`<div class="tw"><table class="t"><thead><tr><th>Negocio</th><th>Plan</th><th>Estado</th><th class="n">Tarifa</th><th>Pagado hasta</th><th>Avisos</th></tr></thead><tbody>
    ${L.map(n=>{ const c=n.comercial; const av=[c.atrasado?`<span class="chip err">Atraso ${c.dias_atraso} d</span>`:'',c.testimonio_pendiente?'<span class="chip">Testimonio</span>':'',c.trueque_por_vencer?'<span class="chip warn">Trueque</span>':''].join(' ');
      return `<tr class="click" data-neg="${esc(n.negocio_id)}"><td><b>${esc(n.nombre)}</b><br><small class="muted">${esc(n.comuna)} · /${esc(n.slug)}</small></td>
      <td>${esc(PLANES[n.plan]||n.plan)}</td><td>${pill(n.estado_servicio)}</td><td class="n">${n.tarifa_mensual?pesos(n.tarifa_mensual):'<span class="muted">sin tarifa</span>'}</td>
      <td>${fecha(c.pagado_hasta)||'<span class="muted">sin pagos</span>'}</td><td>${av}</td></tr>`; }).join('')}
  </tbody></table></div>`;

async function asistenteNegocio(){
  const D={negocio:{},dueno:{}}; let paso=1;
  const pasos=n=>`<div class="pasos">${[1,2,3].map(i=>`<span class="${i<=n?'on':''}"></span>`).join('')}</div>`;
  const vistas={
    1:()=>`${pasos(1)}<p class="muted" style="margin-top:0">Paso 1 de 3: datos del local</p><div class="grid g2">
      <label class="f">Nombre del negocio<input id="w-nombre" value="${esc(D.negocio.nombre||'')}"></label>
      <label class="f">Dirección web (slug)<input id="w-slug" value="${esc(D.negocio.slug||'')}" placeholder="se genera del nombre"></label>
      <label class="f">Dirección<input id="w-dir" value="${esc(D.negocio.direccion||'')}"></label>
      <label class="f">Comuna<input id="w-comuna" value="${esc(D.negocio.comuna||'')}"></label>
      <label class="f">WhatsApp<input id="w-wa" value="${esc(D.negocio.whatsapp||'')}" placeholder="+56912345678"></label>
      <label class="f">Instagram<input id="w-ig" value="${esc(D.negocio.instagram||'')}" placeholder="usuario sin @"></label></div>`,
    2:()=>`${pasos(2)}<p class="muted" style="margin-top:0">Paso 2 de 3: plan y condiciones</p>
      <div class="opciones">${Object.entries(PLANES).map(([k,v])=>`<label class="opcion"><input type="radio" name="w-plan" value="${k}" ${D.negocio.plan===k?'checked':''}><span><b>${v}</b><small>${{WEB:'Carta, WhatsApp y redes',WEB_PEDIDOS:'Retiro y delivery con seguimiento',COMPLETO:'Cocina, reparto, CRM e informes'}[k]}</small></span></label>`).join('')}</div>
      <div class="grid g2 mt"><label class="f">Tarifa mensual (pesos)<input id="w-tarifa" inputmode="numeric" value="${esc(D.negocio.tarifa_mensual||'')}" placeholder="Vacío si aún no se define"></label>
      <label class="f">Trueque hasta (opcional)<input type="date" id="w-trueque" value="${esc(D.negocio.trueque_hasta||'')}"></label></div>
      <p class="muted" style="font-size:13px">Desde el día 30 de uso, el negocio debe publicar un testimonio en sus redes a favor de PrestoPronto, sin costo. La Consola te avisará.</p>`,
    3:()=>`${pasos(3)}<p class="muted" style="margin-top:0">Paso 3 de 3: cuenta del dueño, propietario o gerente</p><div class="grid g2">
      <label class="f">Nombre<input id="w-dn" value="${esc(D.dueno.nombre||'')}"></label>
      <label class="f">Correo (será su usuario)<input type="email" id="w-de" value="${esc(D.dueno.email||'')}"></label>
      <label class="f">Teléfono<input id="w-dt" value="${esc(D.dueno.telefono||'')}"></label></div>
      <p class="muted" style="font-size:13px">Al crear el negocio se genera una clave temporal para el dueño. Se muestra una sola vez.</p>`
  };
  const leerPaso=()=>{
    if(paso===1) Object.assign(D.negocio,{nombre:val('w-nombre'),slug:val('w-slug'),direccion:val('w-dir'),comuna:val('w-comuna'),whatsapp:val('w-wa'),instagram:val('w-ig').replace(/^@/,'')});
    if(paso===2) Object.assign(D.negocio,{plan:(document.querySelector('input[name=w-plan]:checked')||{}).value||'',tarifa_mensual:val('w-tarifa'),trueque_hasta:val('w-trueque')});
    if(paso===3) Object.assign(D.dueno,{nombre:val('w-dn'),email:val('w-de'),telefono:val('w-dt')});
  };
  const validar=()=>{
    if(paso===1&&!D.negocio.nombre) return 'Escribe el nombre del negocio.';
    if(paso===2&&!D.negocio.plan) return 'Elige un plan.';
    if(paso===3&&(!D.dueno.nombre||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(D.dueno.email))) return 'Escribe el nombre y un correo válido del dueño.';
    return '';
  };
  let error='';
  while(true){
    const cuerpo=vistas[paso]()+(error?`<div id="dlg-err" class="aviso err mt">${esc(error)}</div>`:'');
    const v=await dialogo('Nuevo negocio',cuerpo,[paso>1?{t:'Atrás',v:'atras'}:null,{t:paso<3?'Siguiente':'Crear negocio',v:'sig',clase:'pri'}].filter(Boolean));
    if(v==='cancel') return;
    leerPaso(); error='';
    if(v==='atras'){ paso--; continue; }
    error=validar(); if(error) continue;
    if(paso<3){ paso++; continue; }
    try{
      cargando(true);
      const r=await PP_API.crearNegocio(D.negocio,D.dueno);
      cargando(false); cerrarDialogo();
      toast('Negocio creado.');
      await mostrarAcceso(Object.assign({},r.acceso));
      abrirFicha(r.negocio_id);
      return;
    }catch(e){ cargando(false); error=e.message; }
  }
}

async function enviarDialogo(cuerpo,titulo,boton,accion){

  }
  cerrarDialogo(); return null;
}

    <div class="mt">${U.length?`<div class="tw"><table class="t"><thead><tr><th>Nombre</th><th>Rol</th><th>Ingreso</th><th>Último ingreso</th><th>Estado</th><th></th></tr></thead><tbody>
      ${U.map(u=>`<tr><td><b>${esc(u.nombre)}</b>${u.telefono?`<br><small class="muted">${esc(u.telefono)}</small>`:''}</td><td>${esc(ROLES[u.rol])}</td>
        <td>${u.email?esc(u.email):'<span class="muted">PIN</span>'}</td><td>${fechaHora(u.ultimo_ingreso)||'<span class="muted">nunca</span>'}</td>
        <td>${u.activo==='NO'?'<span class="chip">Desactivado</span>':u.bloqueado?'<span class="chip err">Bloqueado</span>':u.debe_cambiar_clave==='SI'?'<span class="chip warn">Clave temporal</span>':'<span class="chip ok">Activo</span>'}</td>
        <td><div class="row"><button class="btn sm" type="button" data-u="reset" data-id="${u.usuario_id}">Restablecer acceso</button>
          <button class="btn sm" type="button" data-u="sesiones" data-id="${u.usuario_id}">Cerrar sesiones</button>
          <button class="btn sm ${u.activo==='NO'?'':'danger'}" type="button" data-u="${u.activo==='NO'?'activar':'desactivar'}" data-id="${u.usuario_id}">${u.activo==='NO'?'Reactivar':'Desactivar'}</button></div></td></tr>`).join('')}
    </tbody></table></div>`:'<div class="vacio">Este negocio aún no tiene personas con acceso.</div>'}</div>
    <p class="muted" style="font-size:13px">Dueño y encargado ingresan con correo y clave. Cocina y repartidores ingresan con un PIN de 6 dígitos.</p></div>`;
  $('#u-nuevo').onclick=()=>dialogoUsuario(FICHA.negocio.negocio_id);
  $$('[data-u]').forEach(b=>b.onclick=()=>accionUsuario(b.dataset.u,b.dataset.id));
}
async function accionUsuario(acc,id){
  try{
    if(acc==='reset'){ const a=await tarea(()=>PP_API.restablecerAcceso(id)); await mostrarAcceso(a); }
    if(acc==='sesiones'){ const r=await tarea(()=>PP_API.cerrarSesionesUsuario(id)); toast(r.cerradas?`Se cerraron ${r.cerradas} sesiones.`:'No tenía sesiones abiertas.'); }
    if(acc==='desactivar'||acc==='activar') await tarea(()=>PP_API.actualizarUsuario({usuario_id:id,activo:acc==='activar'?'SI':'NO'}),acc==='activar'?'Persona reactivada.':'Persona desactivada.');
    if(FICHA&&!$('#tab-ficha').hidden) await recargarFicha(); else verEquipo();
  }catch(e){}
}
async function dialogoUsuario(neg){
  const esEquipo=!neg;
  const html=`<div class="grid g2">
    ${esEquipo?'':`<label class="f">Rol<select id="u-rol"><option value="DUENO">Dueño, propietario o gerente</option><option value="ENCARGADO">Encargado</option><option value="COCINA">Cocina (PIN)</option><option value="REPARTIDOR">Repartidor (PIN)</option></select></label>`}
    ${campo('u-nombre','Nombre','')}<span id="u-w-email">${campo('u-email','Correo (será su usuario)','','email')}</span>${campo('u-tel','Teléfono','')}
    <span id="u-w-veh" hidden>${campo('u-veh','Vehículo','')}</span><span id="u-w-pat" hidden>${campo('u-pat','Patente','')}</span><span id="u-w-col" hidden>${campo('u-col','Color del vehículo','')}</span></div>`;
  const p=enviarDialogo(html,esEquipo?'Agregar al equipo PrestoPronto':'Agregar persona','Crear acceso',()=>PP_API.crearUsuario({negocio_id:neg||'',rol:esEquipo?'SUPERADMIN':val('u-rol'),nombre:val('u-nombre'),email:val('u-email'),telefono:val('u-tel'),vehiculo:val('u-veh'),patente:val('u-pat'),color_vehiculo:val('u-col')}));
  const sync=()=>{ const r=esEquipo?'SUPERADMIN':val('u-rol'); $('#u-w-email').hidden=['COCINA','REPARTIDOR'].includes(r); ['veh','pat','col'].forEach(x=>$('#u-w-'+x).hidden=r!=='REPARTIDOR'); };
  if(!esEquipo) $('#u-rol').onchange=sync; sync();
  const a=await p;
  if(a){ await mostrarAcceso(a); if(esEquipo) verEquipo(); else await recargarFicha(); }
}

/* ---------- Sitio ---------- */
function subSitio(){
  const n=FICHA.negocio;
  $('#sub').innerHTML=`<div class="panel"><h2>Dirección y dominio</h2><div class="grid g2">
    ${campo('s-slug','Dirección web (slug)',n.slug)}${campo('s-sub','Subdominio en la plataforma',n.subdominio)}
    ${campo('s-dom','Dominio propio (opcional)',n.dominio_propio)}
    <label class="f">Estado del dominio<select id="s-edom">${[['','Sin dominio propio'],['PENDIENTE','Pendiente'],['VERIFICADO','Verificado'],['ACTIVO','Activo']].map(([k,v])=>`<option value="${k}" ${(n.estado_dominio||'')===k?'selected':''}>${v}</option>`).join('')}</select></label></div>
    <p class="muted" style="font-size:13px">En el demo, la web del negocio se abre en <a href="${esc(urlWeb(n.slug))}" target="_blank" rel="noopener">${esc(urlWeb(n.slug))}</a> (se habilita con la web conectada). El dominio propio queda registrado para la migración.</p></div>
    <div class="panel"><h2>Apariencia</h2><div class="grid g3">
      <label class="f">Plantilla<select id="s-pl">${[['clasica','Clásica'],['vitrina','Vitrina'],['express','Express']].map(([k,v])=>`<option value="${k}" ${(n.plantilla||'clasica')===k?'selected':''}>${v}</option>`).join('')}</select></label>
      <label class="f">Color principal<input type="color" id="s-col" value="${esc(n.color_acento||'#E53935')}" style="height:42px;padding:4px"></label>
      ${campo('s-logo','Enlace del logo',n.logo,'url')}</div>
    <p class="muted" style="font-size:13px">El dueño podrá cambiar la apariencia desde su Administrador del sitio cuando conectemos la web.</p>
    <div class="row"><span class="spacer"></span><button class="btn pri" type="button" id="s-guardar">Guardar sitio</button></div></div>`;
  $('#s-guardar').onclick=()=>tarea(async()=>{ await PP_API.guardarNegocio({negocio_id:n.negocio_id,slug:val('s-slug'),subdominio:val('s-sub'),dominio_propio:val('s-dom'),estado_dominio:val('s-edom'),plantilla:val('s-pl'),color_acento:val('s-col').toUpperCase(),logo:val('s-logo')}); await recargarFicha(); },'Sitio guardado.');
}

/* ---------- Historial ---------- */
function filasBitacora(L,conNegocio){
  if(!L.length) return '<div class="vacio">Sin registros.</div>';
  return `<div class="tw"><table class="t"><thead><tr><th>Fecha</th>${conNegocio?'<th>Negocio</th>':''}<th>Quién</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>
    ${L.map(b=>`<tr><td style="white-space:nowrap">${fechaHora(b.fecha)}</td>${conNegocio?`<td>${esc(b.negocio_id)}</td>`:''}<td>${esc(b.usuario_nombre)}${b.soporte==='SI'?' <span class="chip">soporte</span>':''}</td><td><b>${esc(b.accion)}</b></td><td>${esc(b.detalle)}</td></tr>`).join('')}</tbody></table></div>`;
}
function subHistorial(){ $('#sub').innerHTML=`<div class="panel"><h2>Historial del negocio</h2>${filasBitacora(FICHA.bitacora,false)}</div>`; }

/* ================= Equipo ================= */
async function verEquipo(){
  const c=$('#tab-equipo'); c.innerHTML='<div class="vacio">Cargando…</div>';
  let L; try{ L=await PP_API.listarEquipo(); }catch(e){ c.innerHTML=`<div class="aviso err">${esc(e.message)}</div>`; return; }
  c.innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">Equipo PrestoPronto</h2><span class="spacer"></span><button class="btn pri sm" type="button" id="e-nuevo">Agregar persona</button></div>
    <p class="muted" style="font-size:13px">Tienen acceso completo a la Consola y pueden entrar como cualquier negocio. Agrega solo a personas de total confianza.</p>
    <div class="tw"><table class="t"><thead><tr><th>Nombre</th><th>Correo</th><th>Último ingreso</th><th>Estado</th><th></th></tr></thead><tbody>
    ${L.map(u=>`<tr><td><b>${esc(u.nombre)}</b>${u.usuario_id===PERFIL.usuario.usuario_id?' <span class="chip">tú</span>':''}</td><td>${esc(u.email)}</td><td>${fechaHora(u.ultimo_ingreso)}</td>
      <td>${u.activo==='NO'?'<span class="chip">Desactivado</span>':u.bloqueado?'<span class="chip err">Bloqueado</span>':'<span class="chip ok">Activo</span>'}</td>
      <td>${u.usuario_id===PERFIL.usuario.usuario_id?'':`<div class="row"><button class="btn sm" type="button" data-u="reset" data-id="${u.usuario_id}">Restablecer acceso</button><button class="btn sm ${u.activo==='NO'?'':'danger'}" type="button" data-u="${u.activo==='NO'?'activar':'desactivar'}" data-id="${u.usuario_id}">${u.activo==='NO'?'Reactivar':'Desactivar'}</button></div>`}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  $('#e-nuevo').onclick=()=>dialogoUsuario('');
  c.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>accionUsuario(b.dataset.u,b.dataset.id));
}

/* ================= Bitácora ================= */
async function verBitacora(){
  const c=$('#tab-bitacora');
  if(!LISTA.length){ try{ LISTA=await PP_API.listarNegocios(); }catch(e){} }
  c.innerHTML=`<div class="panel"><div class="toolbar" style="grid-template-columns:1fr 1fr 1fr 2fr auto">
      ${campo('b-desde','Desde',hoyIso(-30),'date')}${campo('b-hasta','Hasta',hoyIso(),'date')}
      <label class="f">Negocio<select id="b-neg"><option value="">Todos</option>${LISTA.map(n=>`<option value="${esc(n.negocio_id)}">${esc(n.nombre)}</option>`).join('')}</select></label>
      ${campo('b-texto','Texto','')}<button class="btn pri" type="button" id="b-buscar">Buscar</button></div><div id="b-res"></div></div>`;
  const buscar=async()=>{ $('#b-res').innerHTML='<div class="vacio">Buscando…</div>';
    try{ const r=await PP_API.bitacora({desde:val('b-desde'),hasta:val('b-hasta'),negocio_id:val('b-neg'),texto:val('b-texto')});
      $('#b-res').innerHTML=`<p class="muted">${r.total} registros${r.total>300?'; se muestran los 300 más recientes':''}.</p>`+filasBitacora(r.filas,true); }
    catch(e){ $('#b-res').innerHTML=`<div class="aviso err">${esc(e.message)}</div>`; } };
  $('#b-buscar').onclick=buscar; buscar();
}

/* ================= Arranque ================= */
PP_API.iniciar({ambiente:'consola', alExpirar:m=>verIngreso(m)});
(async function(){
  if(!PP_API.configurado()){ verIngreso('Falta configurar la URL del sistema en el archivo api.js.'); return; }
  if(PP_API.tieneSesion()){ cargando(true); try{ await abrir(await PP_API.perfil()); return; }catch(e){ verIngreso(e.codigo==='SESION'?e.message:''); return; } finally{ cargando(false); } }
  verIngreso('');
})();
</script>
