<style>
:root{
  --fondo:#111111; --sup:#1C1C1C; --sup2:#262626; --linea:#333; --txt:#F5F3EF; --txt2:#A8A39C;
  --rojo:#E53935; --verde:#22A55A; --amarillo:#F2C500; --azul:#3B82F6; --naranjo:#F28C28;
  --f-tit:"Poppins",system-ui,sans-serif; --f-txt:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f-txt);background:var(--fondo);color:var(--txt);-webkit-font-smoothing:antialiased;font-size:16px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- Ingreso ---------- */
#ingreso{min-height:100%;display:grid;place-items:center;padding:24px}
.caja{width:min(380px,100%);text-align:center}
.caja .marca svg{height:38px;width:auto;color:#fff}
.caja h1{font-family:var(--f-tit);font-size:28px;margin:22px 0 4px}
.caja p{color:var(--txt2);font-size:15px}
.campo{display:block;text-align:left;font-size:14px;font-weight:600;color:var(--txt2);margin:22px 0 6px}
.campo input{display:block;width:100%;margin-top:6px;background:var(--sup);border:1px solid var(--linea);border-radius:12px;padding:13px 14px;font-size:17px}
.puntos{display:flex;justify-content:center;gap:14px;margin:22px 0 18px;height:18px}
.puntos i{width:16px;height:16px;border-radius:50%;border:2px solid var(--txt2)}
.puntos i.on{background:var(--txt);border-color:var(--txt)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.teclado button{height:64px;border-radius:16px;border:0;background:var(--sup2);font-size:26px;font-weight:700}
.teclado button:active{background:#3a3a3a}
.teclado .ent{background:var(--rojo);font-size:17px}
.teclado .bor{font-size:17px;color:var(--txt2)}
.err{color:#FF6B61;font-weight:600;font-size:14px;min-height:22px;margin-top:12px}

/* ---------- Tablero ---------- */
#tablero{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:#0A0A0A;border-bottom:1px solid var(--linea);flex-wrap:wrap}
header .marca svg{height:28px;width:28px}
header h1{font-family:var(--f-tit);font-size:19px;line-height:1.1}
header h1 small{display:block;font-family:var(--f-txt);font-size:12.5px;color:var(--txt2);font-weight:500}
.esp{flex:1}
.reloj{font-family:var(--f-tit);font-size:22px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;background:var(--sup2);color:var(--txt)}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.ok{background:rgba(34,165,90,.18);color:#5FD08E}
.chip.mal{background:rgba(229,57,53,.2);color:#FF8A80}
.hb{border:1px solid var(--linea);background:var(--sup);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center}
.hb svg{width:18px;height:18px}
.hb.alerta{background:var(--amarillo);color:#111;border-color:var(--amarillo)}
.aviso-sup{background:#5A1D1A;color:#FFD3CF;padding:10px 16px;font-weight:600;font-size:14px}

.tabs{display:none;gap:6px;padding:10px 12px 0}
.tabs button{flex:1;border:0;border-radius:12px 12px 0 0;background:var(--sup);padding:12px 6px;font-weight:700;font-size:15px;color:var(--txt2)}
.tabs button.on{background:var(--sup2);color:var(--txt)}
.tabs b{display:inline-block;min-width:24px;padding:1px 7px;border-radius:999px;background:#3a3a3a;margin-left:4px;font-size:13px}
.tabs button.nuevos b{background:var(--rojo);color:#fff}

.cols{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;background:#161616;border-radius:16px;border:1px solid #222}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-family:var(--f-tit);font-weight:700;font-size:17px;border-bottom:1px solid #222}
.col-h .n{margin-left:auto;font-family:var(--f-txt);font-size:14px;background:var(--sup2);border-radius:999px;padding:2px 10px}
.col-h .dot{width:10px;height:10px;border-radius:50%}
.col-b{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.vacio{color:var(--txt2);text-align:center;padding:28px 10px;font-size:15px}
@media (max-width:899px){
  header{gap:8px 10px}
  #t-hoy{display:none}
  .reloj{font-size:18px}
  .hb{padding:8px 10px}
  .hb .tx{display:none}
  .tabs{display:flex}
  .cols{grid-template-columns:1fr;padding:0 12px 12px}
  .col{display:none;border-radius:0 0 16px 16px}
  .col.on{display:flex}
  .col-h{display:none}
}

/* ---------- Tarjeta de pedido ---------- */
.ped{background:var(--sup);border:1px solid var(--linea);border-radius:14px;padding:14px;position:relative}
.ped.nuevo{border-color:var(--rojo);box-shadow:0 0 0 2px rgba(229,57,53,.35);animation:latido 1.6s ease-in-out 3}
@keyframes latido{50%{box-shadow:0 0 0 6px rgba(229,57,53,.15)}}
.ped-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ped-h .nro{font-family:var(--f-tit);font-size:24px;font-weight:800;line-height:1}
.tag{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:3px 7px}
.tag.del{background:rgba(59,130,246,.2);color:#93C0FF}
.tag.ret{background:rgba(242,197,0,.18);color:var(--amarillo)}
.tag.cam{background:rgba(242,140,40,.2);color:#FFB36B}
.ped-h .hora{margin-left:auto;color:var(--txt2);font-size:14px}
.tiempo{font-weight:800;font-size:14px;border-radius:8px;padding:3px 8px;background:var(--sup2)}
.tiempo.v{background:rgba(34,165,90,.2);color:#5FD08E}
.tiempo.a{background:rgba(242,197,0,.2);color:var(--amarillo)}
.tiempo.r{background:rgba(229,57,53,.25);color:#FF8A80}
.items{list-style:none;margin:12px 0 4px;display:flex;flex-direction:column;gap:6px}
.items li{display:flex;gap:10px;font-size:18px;font-weight:600;line-height:1.25}
.items .c{font-family:var(--f-tit);font-weight:800;min-width:34px;color:var(--amarillo)}
.items small{display:block;font-size:14px;color:var(--txt2);font-weight:500}
.items .nc{color:var(--txt2);font-weight:500;margin-right:4px}
.nota{background:var(--amarillo);color:#111;border-radius:10px;padding:8px 10px;font-weight:700;margin:10px 0 4px;font-size:15px}
.dato{font-size:14px;color:var(--txt2);margin-top:8px;line-height:1.45}
.dato b{color:var(--txt)}
.dato a{color:#93C0FF}
.pago{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.pago .t{font-weight:800}
.badge{border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:800}
.badge.esp{background:var(--rojo);color:#fff}
.badge.ok{background:rgba(34,165,90,.2);color:#5FD08E}
.motivo{margin-top:8px;color:#FF8A80;font-weight:600;font-size:14px}
.acc{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.b{border:0;border-radius:12px;padding:14px 16px;font-weight:800;font-size:16px;flex:1;min-width:120px}
.b.pri{background:var(--verde);color:#fff}
.b.azul{background:var(--azul);color:#fff}
.b.ama{background:var(--amarillo);color:#111}
.b.sec{background:var(--sup2);color:var(--txt);flex:0 0 auto}
.b.peligro{background:transparent;border:1.5px solid #5A2522;color:#FF8A80;flex:0 0 auto}
.b:disabled{opacity:.55;cursor:wait}

/* ---------- Historial ---------- */
.hist{padding:0 12px 12px}
.hist summary{cursor:pointer;color:var(--txt2);font-weight:600;padding:10px 4px}
.hist table{width:100%;border-collapse:collapse;font-size:14px}
.hist td{padding:8px 6px;border-bottom:1px solid #222}
.hist td.n{text-align:right}

/* ---------- Diálogo ---------- */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:18px;z-index:40}
.dlg{background:var(--sup);border:1px solid var(--linea);border-radius:18px;padding:22px;width:min(440px,100%)}
.dlg h2{font-family:var(--f-tit);font-size:21px;margin-bottom:6px}
.dlg p{color:var(--txt2);font-size:15px}
.opciones{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.opciones button{border:1px solid var(--linea);background:var(--sup2);border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px}
.opciones button.on{background:var(--txt);color:#111;border-color:var(--txt)}
.dlg textarea{width:100%;background:var(--fondo);border:1px solid var(--linea);border-radius:12px;padding:12px;min-height:80px;margin-top:4px}
.dlg .acc{margin-top:18px}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#F5F3EF;color:#111;padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:92vw}
#toast.err{background:var(--rojo);color:#fff}
</style>
</head>

</section>

<div id="capa"></div>
<div id="toast" hidden></div>

<script src="../api.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CLP=new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0});
const pesos=n=>CLP.format(Number(n)||0);
function leerLS(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function escribirLS(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
let toastT=null;
function aviso(m,err){ const t=$('#toast'); t.textContent=m; t.className=err?'err':''; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,err?6000:2500); }

PP_API.iniciar({ambiente:'cocina', alExpirar:()=>{ detener(); mostrarIngreso('Tu sesión terminó. Ingresa de nuevo con tu PIN.'); }});

/* ================= Ingreso con PIN ================= */
const SLUG_URL=(new URLSearchParams(location.search).get('n')||'').trim().toLowerCase();
let PIN='';
function pintarPuntos(){ $('#puntos').innerHTML=Array.from({length:Math.max(4,PIN.length)},(_,i)=>`<i class="${i<PIN.length?'on':''}"></i>`).join(''); }
function mostrarIngreso(msg){
  $('#tablero').hidden=true; $('#ingreso').hidden=false; PIN=''; pintarPuntos();
  const slug=SLUG_URL||leerLS('pp_cocina_local')||'';
  $('#i-local').value=slug; $('#campo-local').hidden=!!SLUG_URL;
  $('#i-err').textContent=msg||'';
}
async function entrar(){
  const local=$('#i-local').value.trim().toLowerCase();
  if(!local){ $('#i-err').textContent='Escribe el nombre del local en la dirección (por ejemplo, labarra).'; return; }
  if(!/^\d{4,6}$/.test(PIN)){ $('#i-err').textContent='El PIN tiene entre 4 y 6 dígitos.'; return; }
  $('#i-err').textContent='Entrando…';
  try{
    const p=await PP_API.ingresarConPin(local,PIN);
    if(!['COCINA','DUENO','ENCARGADO'].includes(p.usuario.rol)){ await PP_API.salir(); throw new Error('Ese PIN no es de cocina.'); }
    escribirLS('pp_cocina_local',local); activarSonido(); iniciarTablero(p);
  }catch(e){ PIN=''; pintarPuntos(); $('#i-err').textContent=e.message; }
}
$('#teclado').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.k==='bor') PIN=PIN.slice(0,-1);
  else if(b.dataset.k==='ent') return entrar();
  else if(PIN.length<6) PIN+=b.textContent;
  $('#i-err').textContent=''; pintarPuntos();
});
document.addEventListener('keydown',e=>{
  if($('#ingreso').hidden||document.activeElement===$('#i-local')) return;
  if(/^\d$/.test(e.key)&&PIN.length<6){ PIN+=e.key; pintarPuntos(); }
  else if(e.key==='Backspace'){ PIN=PIN.slice(0,-1); pintarPuntos(); }
  else if(e.key==='Enter') entrar();
});

/* ================= Sonido y pantalla encendida ================= */
let AUDIO=null, SONIDO=leerLS('pp_cocina_sonido')!=='NO';
function activarSonido(){ try{ AUDIO=AUDIO||new (window.AudioContext||window.webkitAudioContext)(); if(AUDIO.state==='suspended') AUDIO.resume(); }catch(e){} }
function campana(){
  if(!SONIDO||!AUDIO) return;
  try{
    [0,0.22,0.44].forEach((t,i)=>{ const o=AUDIO.createOscillator(), g=AUDIO.createGain();
      o.type='sine'; o.frequency.value=i===2?1175:880; o.connect(g); g.connect(AUDIO.destination);
      const t0=AUDIO.currentTime+t; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.5,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.2);
      o.start(t0); o.stop(t0+0.22); });
  }catch(e){}
}
function pintarSonido(){
  $('#b-sonido').innerHTML=SONIDO?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span class="tx">Sonido</span>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M22 9l-6 6M16 9l6 6"/></svg><span class="tx">Silencio</span>';
  $('#b-sonido').classList.toggle('alerta',!SONIDO);
}
$('#b-sonido').onclick=()=>{ SONIDO=!SONIDO; escribirLS('pp_cocina_sonido',SONIDO?null:'NO'); activarSonido(); pintarSonido(); if(SONIDO) campana(); };
let BLOQUEO=null;
async function pantallaEncendida(){ try{ if('wakeLock' in navigator && !BLOQUEO && document.visibilityState==='visible'){ BLOQUEO=await navigator.wakeLock.request('screen'); BLOQUEO.addEventListener('release',()=>BLOQUEO=null); } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&!$('#tablero').hidden){ pantallaEncendida(); cargar(); } });

/* ================= Tablero ================= */
let PERFIL=null, DATOS=null, VISTOS=null, TIMER=null, RELOJ=null, DESFASE=0, COL='nuevos', OCUPADO=false;
function iniciarTablero(p){
  PERFIL=p; $('#ingreso').hidden=true; $('#tablero').hidden=false;
  $('#t-neg').innerHTML=`${esc(p.negocio?p.negocio.nombre:'')}<small>${esc(p.usuario.nombre)}</small>`;
  const sus=p.negocio&&p.negocio.estado_servicio==='SUSPENDIDO';
  $('#aviso-sup').hidden=!sus; $('#aviso-sup').textContent=sus?'El servicio de este local está suspendido: puedes ver los pedidos, pero no cambiarlos. Contacta a PrestoPronto.':'';
  pintarSonido(); pantallaEncendida(); VISTOS=null; cargar();
  clearInterval(TIMER); TIMER=setInterval(cargar,15000);
  clearInterval(RELOJ); RELOJ=setInterval(tic,1000); tic();
}
function detener(){ clearInterval(TIMER); clearInterval(RELOJ); TIMER=RELOJ=null; }
$('#b-salir').onclick=async()=>{ if(!confirm('¿Cerrar la sesión de cocina en este equipo?')) return; detener(); await PP_API.salir(); mostrarIngreso(''); };
$('#tabs').onclick=e=>{ const b=e.target.closest('[data-col]'); if(!b) return; COL=b.dataset.col; $$('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); $$('.col').forEach(c=>c.classList.toggle('on',c.dataset.col===COL)); };

const ahora=()=>new Date(Date.now()+DESFASE);
const hhmm=d=>{ const x=new Date(d); return isNaN(x)?'':x.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}); };
const minDesde=d=>Math.max(0,Math.floor((ahora()-new Date(d))/60000));
function tic(){
  $('#reloj').textContent=ahora().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  $$('[data-desde]').forEach(el=>{ el.replaceWith(htmlTiempo(el.dataset.desde,+el.dataset.meta||0,el.dataset.pref||'')); });
}
function htmlTiempoStr(desde,meta,pref){
  const m=minDesde(desde); let cl='';
  if(meta){ cl=m>meta?'r':(m>meta*0.75?'a':'v'); }
  else cl=m>=10?'r':(m>=5?'a':'v');
  return `<span class="tiempo ${cl} num" data-desde="${esc(desde)}" data-meta="${meta||''}" data-pref="${esc(pref)}">${pref}${m}${meta?' / '+meta:''} min</span>`;
}
function htmlTiempo(desde,meta,pref){ const t=document.createElement('template'); t.innerHTML=htmlTiempoStr(desde,meta,pref); return t.content.firstChild; }

async function cargar(){
  if(OCUPADO) return;
  try{
    const d=await PP_API.cocinaPedidos();
    DESFASE=new Date(d.ahora)-Date.now(); DATOS=d; pintar();
  }catch(e){ if(e.codigo!=='SESION') aviso(e.message,true); }
}
function pintar(){
  const L=DATOS.pedidos, fin=['ENTREGADO','RECHAZADO','CANCELADO'];
  const nuevos=L.filter(p=>p.estado==='RECIBIDO'), prep=L.filter(p=>p.estado==='EN_PREPARACION'), listos=L.filter(p=>p.estado==='LISTO'||p.estado==='EN_CAMINO');
  const terminados=L.filter(p=>fin.includes(p.estado)).sort((a,b)=>new Date(b.fecha_hora)-new Date(a.fecha_hora));
  // pedidos nuevos desde la última carga
  const ids=new Set(nuevos.map(p=>p.pedido_id));
  const recien=VISTOS?nuevos.filter(p=>!VISTOS.has(p.pedido_id)).map(p=>p.pedido_id):[];
  if(recien.length){ campana(); aviso(recien.length>1?`Llegaron ${recien.length} pedidos nuevos`:'Llegó un pedido nuevo'); }
  VISTOS=new Set([...(VISTOS||[]),...ids]);
  const lista=(arr,vacio)=>arr.length?arr.map(p=>tarjeta(p,recien.includes(p.pedido_id))).join(''):`<div class="vacio">${vacio}</div>`;
  $('#l-nuevos').innerHTML=lista(nuevos,'Sin pedidos nuevos.');
  $('#l-prep').innerHTML=lista(prep,'Nada en preparación.');
  $('#l-listos').innerHTML=lista(listos,'Nada listo por entregar.');
  [['nuevos',nuevos],['prep',prep],['listos',listos]].forEach(([k,a])=>{ $('#n-'+k).textContent=a.length; $('#c-'+k).textContent=a.length; });
  document.title=(nuevos.length?`(${nuevos.length}) `:'')+'Cocina · PrestoPronto';
  const h=DATOS.negocio.estado_horario||{};
  $('#t-hor').hidden=!h.conocido; $('#t-hor').className='chip '+(h.abierto?'ok':'mal'); $('#t-hor').innerHTML=`<i></i>${h.abierto?'Abierto':'Cerrado'}`;
  $('#t-hoy').textContent=`${DATOS.resumen.pedidos_hoy} pedidos hoy`;
  $('#l-hist').innerHTML=terminados.length?`<table>${terminados.map(p=>`<tr><td><b>#${esc(p.numero)}</b></td><td>${hhmm(p.fecha_hora)}</td><td>${p.tipo_entrega==='DELIVERY'?'Delivery':'Retiro'}</td><td>${esc(nombreEstado(p.estado))}${p.motivo_rechazo?': '+esc(p.motivo_rechazo):''}</td><td class="n num">${pesos(p.total)}</td><td class="n">${p.calificar&&(p.calificar.cliente||(p.calificar.repartidor&&puedeCancelar()))?`<button class="b sec" style="padding:6px 10px;font-size:13px" data-calif="${esc(p.pedido_id)}">★ Calificar</button>`:''}</td></tr>`).join('')}</table>`:'<div class="vacio">Todavía no hay pedidos terminados.</div>';
}
function nombreEstado(e){ return {RECIBIDO:'Nuevo',EN_PREPARACION:'En preparación',LISTO:'Listo',EN_CAMINO:'En camino',ENTREGADO:'Entregado',RECHAZADO:'Rechazado',CANCELADO:'Cancelado'}[e]||e; }
const puedeCancelar=()=>PERFIL&&['DUENO','ENCARGADO'].includes(PERFIL.usuario.rol);

function tarjeta(p,nuevo){
  const del=p.tipo_entrega==='DELIVERY';
  const tags=`<span class="tag ${del?'del':'ret'}">${del?'Delivery':'Retiro'}</span>${p.estado==='EN_CAMINO'?'<span class="tag cam">En camino</span>':''}`;
  let tiempo='';
  if(p.estado==='RECIBIDO') tiempo=htmlTiempoStr(p.fecha_hora,0,'Espera ');
  else if(p.estado==='EN_PREPARACION') tiempo=htmlTiempoStr(p.hora_aceptado||p.fecha_hora,p.tiempo_prep_min||DATOS.negocio.tiempo_prep_min,'');
  else if(p.estado==='LISTO') tiempo=htmlTiempoStr(p.hora_listo||p.fecha_hora,0,'Listo hace ');
  else if(p.estado==='EN_CAMINO') tiempo=htmlTiempoStr(p.hora_despacho||p.fecha_hora,0,'Salió hace ');
  const items=`<ul class="items">${p.items.map(x=>`<li><span class="c num">${x.cantidad}×</span><span>${x.numero_carta!==''&&x.numero_carta!=null?`<span class="nc">${esc(x.numero_carta)}</span>`:''}${esc(x.nombre)}${x.variante?`<small>${esc(x.variante)}</small>`:''}</span></li>`).join('')}</ul>`;
  const espera=p.estado_pago==='PENDIENTE_TRANSFERENCIA';
  const cobrar=['EFECTIVO','TARJETA','TRANSFERENCIA_ENTREGA'].includes(p.medio_pago);
  const pago=`<div class="pago"><span class="t">${esc(p.medio_pago_texto)}</span>${espera?`<span class="badge esp">Esperando transferencia de ${pesos(p.total)}</span>`:p.estado_pago==='PAGADO'?'<span class="badge ok">Pagado</span>':cobrar?`<span>Cobrar <b class="num">${pesos(p.total)}</b>${del&&p.costo_despacho==null?' + despacho':''}</span>`:''}</div>`;
  const cn=p.cliente.calificacion;
  const cli=`<div class="dato"><b>${esc(p.cliente.nombre||'Cliente')}</b>${cn?(cn.nuevo?' <span class="badge" style="background:#333">Cliente nuevo</span>':` <span class="badge" style="background:rgba(242,197,0,.2);color:var(--amarillo)">★ ${String(cn.promedio).replace('.',',')}</span>`):''}${p.cliente.telefono?` · <a href="tel:${esc(p.cliente.telefono)}">${esc(p.cliente.telefono)}</a>`:''}</div>`;
  const dir=del&&p.direccion?`<div class="dato">${esc(p.direccion.texto)}${p.direccion.referencia?`<br>Ref.: ${esc(p.direccion.referencia)}`:''}${p.distancia_km!==''&&p.distancia_km!=null?`<br>${String(p.distancia_km).replace('.',',')} km${p.anillo?' · '+esc(p.anillo):''}`:''}</div>`:'';
  let acc='';
  const id=esc(p.pedido_id), est=esc(p.estado);
  if(p.estado==='RECIBIDO'){
    acc=espera?`<button class="b ama" data-a="transf" data-id="${id}">Transferencia recibida</button>`:`<button class="b pri" data-a="aceptar" data-id="${id}" data-est="${est}">Aceptar</button>`;
    acc+=`<button class="b peligro" data-a="rechazar" data-id="${id}" data-est="${est}">Rechazar</button>`;
  } else if(p.estado==='EN_PREPARACION'){
    acc=`<button class="b pri" data-a="LISTO" data-id="${id}" data-est="${est}">Listo</button>`+(puedeCancelar()?`<button class="b peligro" data-a="cancelar" data-id="${id}" data-est="${est}">Cancelar</button>`:'');
  } else if(p.estado==='LISTO'){
    acc=del?`<button class="b azul" data-a="EN_CAMINO" data-id="${id}" data-est="${est}">Salió a reparto</button>`:`<button class="b pri" data-a="ENTREGADO" data-id="${id}" data-est="${est}">Entregado al cliente</button>`;
  } else if(p.estado==='EN_CAMINO'){
    acc=`<button class="b pri" data-a="ENTREGADO" data-id="${id}" data-est="${est}">Entregado</button>`;
  }
  return `<article class="ped${nuevo?' nuevo':''}" data-ped="${id}">
    <div class="ped-h"><span class="nro num">#${esc(p.numero)}</span>${tags}<span class="hora num">${hhmm(p.fecha_hora)}</span>${tiempo}</div>
    ${items}${p.nota?`<div class="nota">Nota: ${esc(p.nota)}</div>`:''}${p.nota_reparto&&p.estado==='LISTO'?`<div class="motivo">Volvió del reparto: ${esc(p.nota_reparto)}</div>`:''}${p.estado==='EN_CAMINO'&&p.repartidor?`<div class="dato">Lo lleva <b>${esc(p.repartidor)}</b></div>`:''}${cli}${dir}${pago}
    <div class="acc">${acc}</div></article>`;
}

/* ================= Acciones ================= */
document.querySelector('.cols').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const p=DATOS.pedidos.find(x=>x.pedido_id===b.dataset.id); if(!p) return;
  const a=b.dataset.a;
  if(a==='aceptar') return dialogoAceptar(p);
  if(a==='rechazar') return dialogoMotivo(p,'RECHAZADO');
  if(a==='cancelar') return dialogoMotivo(p,'CANCELADO');
  if(a==='transf'){
    if(!confirm(`¿Confirmas que llegó la transferencia de ${pesos(p.total)} del pedido #${p.numero}?`)) return;
    return ejecutar(b,()=>PP_API.confirmarTransferencia(p.pedido_id),'Transferencia confirmada. Ya puedes aceptar el pedido.');
  }
  return ejecutar(b,()=>PP_API.cocinaCambiarEstado(p.pedido_id,a,p.estado),{LISTO:`Pedido #${p.numero} listo`,EN_CAMINO:`Pedido #${p.numero} salió a reparto`,ENTREGADO:`Pedido #${p.numero} entregado`}[a]);
});
async function ejecutar(boton,fn,ok){
  OCUPADO=true; if(boton){ boton.disabled=true; }
  try{ await fn(); if(ok) aviso(ok); }
  catch(e){ aviso(e.message,true); }
  finally{ OCUPADO=false; cerrarDlg(); await cargar(); }
}
function dlg(html){ $('#capa').innerHTML=`<div class="velo" id="velo"><div class="dlg" role="dialog" aria-modal="true">${html}</div></div>`; }
function cerrarDlg(){ $('#capa').innerHTML=''; }
$('#capa').addEventListener('click',e=>{ if(e.target.id==='velo'||e.target.closest('[data-cerrar]')) cerrarDlg(); });
function dialogoAceptar(p){
  const base=p.tiempo_prep_min||DATOS.negocio.tiempo_prep_min||30;
  const ops=[...new Set([15,20,30,45,60,base])].sort((a,b)=>a-b);
  let min=base;
  dlg(`<h2>Aceptar pedido #${esc(p.numero)}</h2><p>¿En cuántos minutos estará listo? El cliente lo ve en su seguimiento.</p>
    <div class="opciones" id="d-min">${ops.map(m=>`<button type="button" data-m="${m}" class="${m===base?'on':''}">${m} min</button>`).join('')}</div>
    <div class="acc"><button class="b sec" data-cerrar>Volver</button><button class="b pri" id="d-ok">Aceptar y preparar</button></div>`);
  $('#d-min').onclick=e=>{ const b=e.target.closest('[data-m]'); if(!b) return; min=+b.dataset.m; $$('#d-min button').forEach(x=>x.classList.toggle('on',x===b)); };
  $('#d-ok').onclick=()=>ejecutar($('#d-ok'),()=>PP_API.cocinaCambiarEstado(p.pedido_id,'EN_PREPARACION',p.estado,{minutos:min}),`Pedido #${p.numero} aceptado`);
}
function dialogoMotivo(p,estado){
  const rech=estado==='RECHAZADO';
  const rapidos=rech?['Se nos acabó un producto','El local está por cerrar','Dirección fuera de nuestra zona','Mucha demanda en este momento']:['El cliente pidió anular','Se nos acabó un producto','Problema en la cocina'];
  dlg(`<h2>${rech?'Rechazar':'Cancelar'} pedido #${esc(p.numero)}</h2><p>El cliente verá este motivo en su seguimiento.</p>
    <div class="opciones" id="d-mot">${rapidos.map(m=>`<button type="button">${esc(m)}</button>`).join('')}</div>
    <textarea id="d-txt" maxlength="200" placeholder="Escribe el motivo"></textarea>
    <div class="acc"><button class="b sec" data-cerrar>Volver</button><button class="b peligro" id="d-ok" style="flex:1;background:var(--rojo);color:#fff;border:0">${rech?'Rechazar pedido':'Cancelar pedido'}</button></div>`);
  $('#d-mot').onclick=e=>{ const b=e.target.closest('button'); if(b) $('#d-txt').value=b.textContent; };
  $('#d-ok').onclick=()=>{
    const m=$('#d-txt').value.trim(); if(m.length<3){ aviso('Escribe el motivo; el cliente lo va a ver.',true); return; }
    ejecutar($('#d-ok'),()=>PP_API.cocinaCambiarEstado(p.pedido_id,estado,p.estado,{motivo:m}),`Pedido #${p.numero} ${rech?'rechazado':'cancelado'}`);
  };
}

/* ================= Calificar ================= */
$('#l-hist').addEventListener('click',e=>{ const b=e.target.closest('[data-calif]'); if(!b) return; const p=DATOS.pedidos.find(x=>x.pedido_id===b.dataset.calif); if(p) dialogoCalificar(p); });
function bloqueEst(clave,titulo,etqs){
  return `<div class="calif" data-calif="${clave}" style="margin-top:14px"><b>${titulo}</b>
    <div class="opciones est" style="margin:8px 0">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}">${'★'.repeat(n)}</button>`).join('')}</div>
    <div class="opciones etq" style="margin:4px 0">${etqs.map(t=>`<button type="button" style="font-size:14px;padding:8px 12px">${esc(t)}</button>`).join('')}</div></div>`;
}
function dialogoCalificar(p){
  const c=p.calificar, rep=c.repartidor&&puedeCancelar();
  dlg(`<h2>Calificar pedido #${esc(p.numero)}</h2><p>Las personas solo ven su promedio, nunca la nota individual.</p>
    ${c.cliente?bloqueEst('cliente','Cliente: '+esc(p.cliente.nombre||''),DATOS.etiquetas.cliente):''}
    ${rep?bloqueEst('repartidor','Repartidor: '+esc(p.repartidor||''),DATOS.etiquetas.repartidor):''}
    <div class="acc"><button class="b sec" data-cerrar>Volver</button><button class="b pri" id="d-ok">Enviar</button></div>`);
  $$('.calif').forEach(bl=>{
    bl.querySelector('.est').onclick=e=>{ const b=e.target.closest('[data-n]'); if(!b) return; bl.querySelectorAll('.est button').forEach(x=>x.classList.toggle('on',x===b)); };
    bl.querySelector('.etq').onclick=e=>{ const b=e.target.closest('button'); if(b) b.classList.toggle('on'); };
  });
  $('#d-ok').onclick=()=>{
    const datos={};
    $$('.calif').forEach(bl=>{ const on=bl.querySelector('.est button.on'); if(on) datos[bl.dataset.calif]={estrellas:+on.dataset.n,etiquetas:[...bl.querySelectorAll('.etq button.on')].map(b=>b.textContent)}; });
    if(!Object.keys(datos).length){ aviso('Elige las estrellas.',true); return; }
    ejecutar($('#d-ok'),()=>PP_API.cocinaCalificar(p.pedido_id,datos),'Calificación guardada');
  };
}

/* ================= Inicio ================= */
(async()=>{
  if(PP_API.tieneSesion()){
    try{ const p=await PP_API.perfil(); if(['COCINA','DUENO','ENCARGADO'].includes(p.usuario.rol)){ document.addEventListener('pointerdown',activarSonido,{once:true}); return iniciarTablero(p); } }catch(e){}
  }
  mostrarIngreso('');
})();
</script>
</body>
